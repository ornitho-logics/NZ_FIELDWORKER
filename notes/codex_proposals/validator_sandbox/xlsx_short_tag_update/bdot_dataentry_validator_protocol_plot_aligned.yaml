      - Clarified that this post-hatch notA closure may follow hiding-spot work recorded in RESIGHTINGS and does not require an intervening D row.
      - Updated the NESTS warning rule so this valid terminal-H-to-notA sequence is not flagged by the no-eggs-with-chicks review.
  - version: 1.1.2
    generated_on: 2026-09-24
    changes:
      - Made CAPTURES tag_action field requirements explicit for D, R, S, and N records.
      - Added chronological CAPTURES tag lifecycle validation across saved rows and the current paste session.
      - Prevented active tags from being redeployed, required S and R tags to be active on the same ring, and required N replacements to remove an active previously deployed tag from that ring.
      - Allowed a tag_id to be deployed again only after an earlier R retrieval recorded that tag in tag_id_in.
      - Required the release tag in an N event to be globally new within current-season CAPTURES history.
  - version: 1.1.1
    generated_on: 2026-09-23
    changes:
      - Defined an H row with clutch_size 0 and brood_size greater than 0 as the one terminal hatch visit for a nest history.
      - Allowed repeated non-terminal H visits while eggs remain, but prohibited any later H visit after the first terminal H row.
      - Required warning-level cross-table review that each H visit with chicks has at least one same-day chick CAPTURES or RESIGHTINGS row per chick.
      - Retained chick-event linkage as a warning rather than a save blocker because linked table records may be entered in separate portal sessions.
  - version: 1.1.0
    generated_on: 2026-09-22
    changes:
      - Synchronized the official protocol and local mirror to the current per-table hard and warning inspector exports.
      - Documented the current portal output contract: rowid, variable, and reason are displayed; a type column is not currently surfaced.
      - Reconciled EGGS event matching, hard egg_id checks, and mock-only float-timing expectations.
