runtime_dependencies:
  required_reference_tables:
    OBSERVERS:
      key_fields: [observer]
      required_fields: [observer, name, start, stop, gps_id, cam_id, nznbbs_number]
    GPS_POINTS:
      purpose: Required to confirm that any entered gps_id / gps_point event location was uploaded from the handheld GPS before event entry.
      minimum_fields: [gps_id, gps_point, datetime_]
    CAPTURES_ARCHIVE:
      purpose: Historical combo validation, morphometric range derivation, prior marked individual lookup.
      minimum_fields: [date, ring, capture_status, age, nest_id, UL, LL, UR, LR, field_sex, tag_id]
    NESTS:
      purpose: Required for EGGS matching, CAPTURES age-stage logic, and RESIGHTINGS brood logic.
      minimum_fields: [nest_id, date, time_visit, observer, nest_state, hatch_state, clutch_size, brood_size]
    EGGS:
      purpose: Required for NESTS event matching and hatch-state float logic.
      minimum_fields: [nest_id, date, time_visit, observer, egg_id, float_angle, float_surface, float_location, comments]
    CAPTURES:
      purpose: Required for RESIGHTINGS combo provenance and brood logic.
      minimum_fields: [date, caught, species, site, nest_id, age, capture_status, ring, UL, LL, UR, LR, chick_tent_photo, chick_hide_photo]
    RESIGHTINGS:
      purpose: Required for CAPTURES chick photo logic and optional for manual or post-save NESTS bird_inc review.
      minimum_fields: [date, gps_id, gps_point, nest_id, age, rclass, UL, LL, UR, LR, sex]
      conditional_fields: [ring when rclass is H]

