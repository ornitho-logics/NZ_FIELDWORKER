  - version: 1.2.2
    generated_on: 2026-09-28
    changes:
      - Allowed WRYB in the NESTS species code list for mixed-species Cass River nest records.
      - Added the Cass River WRYB positive nest_id pattern WR + two-digit gps_id + two-digit sequence, while retaining the existing BADO A/B/C pattern and non-Cass BADO BA pattern.
      - Clarified that this is a NESTS-specific species and identifier exception; it does not silently broaden unrelated table-specific species policies.
  - version: 1.2.1
    generated_on: 2026-09-27
    changes:
      - Added the nullable RESIGHTINGS.ring field to the protocol target columns and made a nonblank normalized ring value a save-blocking requirement whenever normalized rclass is H.
      - Clarified that the H-class ring is the metal-ring code for the hiding-spot-photo individual, is reported on variable ring, and does not replace UL, LL, UR, or LR.
      - Kept ring nullable for all other RESIGHTINGS classes and deliberately added no CAPTURES-specific ring regex or live cross-table ring-consistency error.
  - version: 1.2.0
    generated_on: 2026-09-27
    changes:
      - Defined negative nest_ids as operational brood identifiers for broods of unknown origin: no eggs were observed, no nest was found, and no stationary nest location is known.
      - Required negative-ID CAPTURES and RESIGHTINGS rows to carry the negative nest_id together with both gps_id and gps_point, with the pair validated against GPS_POINTS; GPS does not conflict with a negative brood ID.
      - Allowed the first negative-brood event to be either CAPTURES or RESIGHTINGS and required one row per observed or captured individual, including repeated X-X rows for unbanded parents or chicks.
      - Clarified that negative IDs are invalid in NESTS and EGGS and that NESTS must direct observed birds to RESIGHTINGS or captured birds to CAPTURES.
      - Made H-class RESIGHTINGS the hiding-spot photo record and limited CAPTURES chick_hide_photo to blank or 0 while retaining chick_tent_photo for tent photos.
