    changes:
      - Removed the exact same-day H-visit chick-event count from the live NESTS warning inspector because CAPTURES and RESIGHTINGS may be entered later or in separate portal sessions.
      - Retained chick-linkage review as post-save QA, where later age-C CAPTURES or RESIGHTINGS are considered and the check never blocks the original NESTS save.
