purpose: >
  Machine-readable rule protocol for implementing DataEntry validators and related
  cross-table QA logic for the 2026-2027 Banded Dotterel field-season portal.
  These rules are derived from the mock-data generation logic agreed in this thread.
  Use this file as the specification for save-time blockers, warning-level validators,
  and post-save / season-wide QA checks.

revision_history:
  - version: 1.3.6
    generated_on: 2026-10-26
    changes:
      - Clarified GLOBAL_005 photo identity so terminal roll-frame prefixes are part of the image number: 101-4122 and 102-4122 are different images, while a final filename extension is ignored for comparison.
      - Allowed only same-session age-C rclass H RESIGHTINGS rows to share a photo range when they use the same camera and date and share either the same nonblank nest_id or the same complete gps_id/gps_point pair.
      - Kept photo ranges globally unique for all other combinations, including adult P/V rows and cross-table CAPTURES, NESTS, and RESIGHTINGS rows; an edited saved row does not conflict with its own stored pk.
  - version: 1.3.5
    generated_on: 2026-10-24
    changes:
      - Added AC (Alert with chick(s)) as a parent-with-chicks behaviour equivalent to BC and FC in RESIGHTINGS parent/chick co-entry, nest-state, GPS-linkage, and mock-generation rules; no other biological rule was changed.
  - version: 1.3.4
    generated_on: 2026-10-10
    changes:
      - Made the same-session parent/chick association save-blocking in RESIGHTINGS: every age-C event, including ordinary rclass R, P, or V rows, must have an age-A parent with behav BC or FC linked by the same date and nest_id or gps_id/gps_point; every BC/FC parent row must have at least one linked age-C row in the same submission.
      - Narrowed the ended-nest blocker so adult IN/NM rows require a latest positive-nest state of F, I, or H, while brood-association BC/FC rows are governed by the separate H/notA state rule and are not blocked merely because the nest has ended.
      - Required positive-nest BC/FC rows to correspond to latest nest_state H or notA, and required gps_id/gps_point for age-C rows and BW/BC/FC parent rows when a notA nest still has brood_size greater than zero.
      - Documented BW as broken-wing display, a shorebird parent behaviour that can occur at either nest or brood stages; it is not a brood-watch code and does not by itself trigger the reciprocal BC/FC chick-event requirement.
  - version: 1.3.3
    generated_on: 2026-09-30
    changes:
      - Required CAPTURES rows with age C and capture_status F to carry a real positive nest_id or negative brood ID; blank nest_id and NO_NEST are no longer accepted for this first chick-capture context.
      - Made gps_id and gps_point optional for positive-nest age-C first captures, while allowing a complete GPS pair when the chick was captured away from the nest; partial pairs remain invalid and supplied pairs remain subject to GPS_POINTS validation.
      - Retained mandatory GPS for negative brood IDs and the ordinary direct-GPS branch for other unlinked CAPTURES rows.
  - version: 1.3.2
    generated_on: 2026-09-30
    changes:
      - Required normalized rclass H RESIGHTINGS ring values to use the CP metal-ring format CP12345 or CP-12345.
      - Required every nonblank H-class ring to already exist in current-season CAPTURES, because a hiding-spot photo is recorded only after the chick has been banded.
      - Added focused hard-rule checks for invalid prefixes such as PC20315, missing CAPTURES history, and equivalent CP/CP-dash representations; ring remains nullable for non-H RESIGHTINGS classes.
  - version: 1.3.1
    generated_on: 2026-09-29
    changes:
      - Added warning rule RES_005H to compare a RESIGHTINGS sex entry with the bird's original capture history.
      - Match the individual by ring when available or by the existing canonical partial leg-mark signature; prefer
        CAPTURES_ARCHIVE gen_sex when it is nonblank, otherwise use archive field_sex, and fall back to current
        CAPTURES field_sex when no definitive archive match exists.
      - Treat M and MU as the same male group and F and FU as the same female group; do not flag U or ambiguous
        capture history as a definitive contradiction, and keep the check warning-level because history can be
        incomplete or uncertain.
  - version: 1.3.0
    generated_on: 2026-09-29
    changes:
      - Required every RESIGHTINGS row with normalized rclass H to use age C; the existing age-C sex U rule remains save-blocking.
      - Made blank, whitespace-only, and textual NA values in the six core H fields count as missing in the H mandatory-field check.
      - Revised the unlinked-H nest_id exception so a blank nest_id is allowed only with the mandatory GPS pair plus either a nonblank H ring or a same-session age-A event at the same GPS pair with LL and LR recorded.
      - Added save-blocking H chick band-layout checks for the M band on UL/UR and the single colour band on LL/LR.
      - Extended positive-nest RESIGHTINGS chronology to accept the first same-day-or-earlier NESTS event with nest_state F, I, or H.
  - version: 1.2.9
    generated_on: 2026-09-29
    changes:
      - Extended NEST_W002 so a blank clutch_size is also flagged when hatch_state is populated and contains N, even when no photo fields are entered.
  - version: 1.2.8
    generated_on: 2026-09-29
    changes:
      - Added warning rule NEST_W002 to flag a blank clutch_size when NESTS photo flags or photo metadata indicate that nest or tent photographs were collected.
      - Kept the rule warning-level so photo evidence prompts correction without blocking unusual but possible records; the existing NESTS photo metadata and clutch_size format rules remain unchanged.
  - version: 1.2.7
    generated_on: 2026-09-29
    changes:
      - Clarified CAP_013 handling for status R rows whose entered input mark differs from the corresponding release mark: when the ring is present in CAPTURES_ARCHIVE or current-season CAPTURES history, the save-blocking message directs the fieldworker to change capture_status to C.
      - Preserved the generic status-R mismatch error when prior ring history is unavailable, and retained the independent requirement that statuses R and C contain complete input and release mark positions.
  - version: 1.2.6
    generated_on: 2026-09-28
    changes:
      - Added warning rule CAP_W013 to flag in situ, insitu, and in-situ wording in CAPTURES.comments when age is C and direct the fieldworker to record hiding-spot photos as a separate RESIGHTINGS rclass H event.
  - version: 1.2.5
    generated_on: 2026-09-28
    changes:
      - Required every RESIGHTINGS row with normalized rclass H to carry both direct gps_id and gps_point, including positive nest-linked H rows; ordinary positive nest-linked non-H rows retain the established nest-location branch.
      - Added the H-specific fieldworker-facing GPS message while retaining GPS_POINTS pair validation and the existing H ring and photo metadata requirements.
  - version: 1.2.4
    generated_on: 2026-09-28
    changes:
      - Removed the automatic live NESTS bird_inc-versus-RESIGHTINGS comparison because RESIGHTINGS has no event-time field and same-date nest/observer/GPS matches do not prove that two rows describe the same visit.
      - Retained the approved bird_inc code-set validation and documented exact-event comparison as manual or future post-save QA only.
  - version: 1.2.3
