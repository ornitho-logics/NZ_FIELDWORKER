  - version: 1.1.5
    generated_on: 2026-09-25
    changes:
      - Made CAPTURES location fields mutually exclusive: a real nest-linked capture uses nest_id without gps_id/gps_point, while an unlinked capture uses both gps_id and gps_point without a real nest_id.
      - Kept NO_NEST as the explicit unlinked-capture sentinel, which belongs to the GPS branch rather than counting as a biological nest link.
  - version: 1.1.4
    generated_on: 2026-09-25
