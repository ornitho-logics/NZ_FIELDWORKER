  negative_brood_nest_regex: "^-BA(0[1-9]|[1-9][0-9])(0[1-9]|[1-9][0-9])$"
  cr_plot_assignment:
    description: >
      In mock data, the Cass River plot letter in nest_id must be assigned from the
      supplied A/B/C polygons rather than arbitrarily. The same CR nest_id must then be
      propagated consistently across NESTS, EGGS, CAPTURES, and RESIGHTINGS.
    positive_nest_anchor_rule: >
      For positive CR nest_ids, use the first NESTS row with non-missing gps_id and
      gps_point as the nest-location anchor.
    negative_brood_anchor_rule: >
      For negative brood-only CR nest_ids, use the earliest current-season CAPTURES or
      RESIGHTINGS row with non-missing gps_id and gps_point as the brood-location anchor.
    fallback_rule: >
      If the anchor point falls outside all three polygons, assign the plot letter from the
      nearest polygon boundary to that anchor point rather than from off-nest captures or
      resightings, which may occur away from the nest itself.
