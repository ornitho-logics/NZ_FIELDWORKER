      - Removed stale live-warning semantics that are now mock-only or no longer implemented.

severity_definitions:
  error: Block save. Entry must be corrected before commit.
  warning: Allow manual review or save-with-review depending on portal design.
  post_save_qa: Do not block a single row save. Run after save or on table refresh.
  mock_generation_only: Distributional target used only to shape or audit mock data generation; never implement as a live data-entry validator, warning, or post-save portal rule.

mock_generation_only_contract:
  applies_to_sections:
    - mock_generation_only_rules
    - season_qc_targets
  classification: mock_generation_only
  use_for_live_dataentry_validation: false
  use_for_save_blocking_validation: false
  use_for_warning_validation: false
  use_for_post_save_portal_validation: false
  use_for_mock_generation_qc_only: true
  ignore_when_validating_real_data_entry: true
  description: >
    Any content stored under mock_generation_only_rules or season_qc_targets is mock-data-generation
    metadata only. These sections exist to shape or audit simulated datasets and must not be translated
    into live portal validators, warning rules, save blockers, or post-save checks for manually entered
    field data.

dataentry_contract:
  runtime_table_symbol: x
  return_columns_required:
    - rowid
    - variable
    - reason
  portal_display_columns:
    - variable
    - reason
    - rowid
  visible_type_column: false
  severity_carrier: Separate TABLE_hard and TABLE_warning inspector rows and the matching hard_rules / warning_rules protocol sections.
  reason_message_convention: >
    Store concise fieldworker-facing reasons without ERROR: or WARNING: prefixes. Current inspector wrappers
    remove stale severity prefixes and append a polite request to double-check the entry and add a validator
    bypass comment when the unusual value is genuinely correct.
  no_issue_return: Return zero rows with the same required columns.
  wrapper_function: try_validator
  wrapper_argument: nam
  inspector_container: list
  preserve_rowid_when_subsetting: true
  preferred_builtin_patterns:
    missing_required_fields: is.na_validator
    allowed_value_sets: is.element_validator
    duplicates_against_reference: is.duplicate_validator
    regex_checks: is.regexp_validator
  preferred_custom_patterns:
    row_logic: "{ ... return data.table(rowid, variable, reason) ... }"
    grouped_logic_current_table: "{ z <- copy(x); ... }"
    cross_table_archive_logic: "{ z <- copy(x); archive <- ...; current_other_table <- ...; ... }"
  implementation_principles:
    - Use local helper objects inside curly braces so validators remain self-contained.
    - Load reference tables explicitly rather than assuming they are attached.
    - Implement exact-column validation before behavioural validation.
    - Separate save blockers from season-level QA targets.
    - Organize live save-time inspectors into only two categories: TABLE_hard and TABLE_warning.
    - Reassign any legacy TABLE_format_residual rules into either hard_rules or warning_rules.

execution_order:
  - Validate column presence and allowed value sets.
  - Validate row-level missingness and within-row coherence.
  - Validate grouped rules within the current table.
  - Validate cross-table rules using current-season companion tables.
  - Validate archive-dependent rules using historical BADOatNZ tables.
  - Run post-save QA summaries for distributional targets.

target_tables:
  OBSERVERS:
    columns: [name, observer, start, stop, gps_id, cam_id, nznbbs_number]
  EGGS:
    columns: [species, observer, date, time_visit, nest_id, egg_id, float_angle, float_surface, float_location, cam_id, photo_start, photo_end, harddrive_id, comments, nov]
  NESTS:
    columns: [species, site, date, time_visit, observer, nest_id, nest_state, hatch_state, bird_inc, gps_id, gps_point, clutch_size, brood_size, cam_id, photo_start, photo_end, nest_photo, tent_photo, comments, nov]
  CAPTURES:
    columns: [date, caught, released, species, site, book_id, form_id, observer, capture_status, capture_method, nest_id, caught_with, parents, gps_id, gps_point, eggs_handled, field_sex, age, ring, UL_in, LL_in, UR_in, LR_in, UL, LL, UR, LR, tarsus, culmen, total_head, head_white, head_black, rufous_band, wing, brood_patch, weight, wt_w_tag, moult_left, moult_right, fat, breast_samp, primary_samp, blood_samp, other_sample, feather_wear, tag_id_in, tag_id, tag_type, tag_action, cam_id, photo_start, photo_end, mugshot_photo, wing_photo, chick_tent_photo, chick_hide_photo, comments, falcon_upload, observer_upload, nov]
  RESIGHTINGS:
