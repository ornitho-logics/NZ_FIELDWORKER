<!doctype html>
<html lang="en-NZ">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2f6fa3">
  <title>Fieldworker — connection needed</title>
  <style>
    :root { color-scheme: light; font: 17px/1.6 system-ui, sans-serif; color: #203c49; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f0f6fa; }
    main { width: 100%; max-width: 440px; padding: 32px; border: 1px solid #d8e5ee; border-radius: 18px; background: white; box-shadow: 0 12px 40px #203c490d; }
    .eyebrow { color: #2f6fa3; font-size: 0.8rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
    h1 { font-size: 1.6rem; line-height: 1.25; margin: 12px 0; }
    p { color: #596b78; }
    button { min-height: 48px; padding: 12px 24px; border: 0; border-radius: 8px; background: #2f6fa3; color: white; font: inherit; font-weight: 600; cursor: pointer; }
    button:focus-visible { outline: 3px solid #183b56; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <span class="eyebrow">Fieldworker</span>
    <h1>Let's get you connected</h1>
    <p>Fieldworker cannot reach the server. Live pages and downloads need a connection.</p>
    <p>Reconnect to Wi-Fi or mobile data, then try again.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>
